name: 기능 또는 개선 작업
description: 총괄이 작업 배정 전에 범위·담당·완료 조건을 기록합니다.
title: "[작업] "
labels: ["type:feature", "status:todo"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표와 사용자 요구
      description: 어떤 상황에서 어떤 동작이 필요합니까?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위와 범위 밖
      value: "포함:\n- \n\n범위 밖:\n- "
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 검증 방법
      value: "- [ ] \n- [ ] 변경에 맞는 검증 결과와 미확인 사항을 PR에 기록한다."
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: 담당 역할과 작업 공간
      description: GitHub 사용자 계정과 에이전트 역할을 구분합니다. 비밀정보·내부 세션 ID는 적지 않습니다.
      value: "총괄: 프로젝트 총괄\n구현 주담당: 미배정\n검토 담당: 미배정\n작업 브랜치: 배정 후 기록"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 선행 작업·관련 기록
      description: 선행 Issue, 관련 설계 또는 PR 링크. 없으면 없음.
      value: 없음
  - type: textarea
    id: status
    attributes:
      label: 현재 상태와 다음 행동
      value: "상태: 대기\n다음 행동: 총괄이 범위와 담당을 확정한 뒤 배정"
