name: 기능 또는 개선 작업
description: 총괄이 작업 배정 전에 범위·담당·완료 조건을 기록합니다.
title: "[작업] "
labels: ["type:feature", "status:todo"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표와 사용자 요구
      description: 어떤 상황에서 어떤 동작이 필요합니까?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위와 범위 밖
      value: "포함:\n- \n\n범위 밖:\n- "
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 검증 방법
      value: "- [ ] \n- [ ] 변경에 맞는 검증 결과와 미확인 사항을 PR에 기록한다.\n- [ ] 최신 PR head의 독립 검토와 필수 unit-tests 통과 후 정상 병합한다."
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: 도메인·실제 담당과 작업공간
      description: team-owners.md의 확인 시점과 실제 배정을 구분합니다. 같은 도메인은 기존 담당을 우선 이어 쓰며 비밀정보·내부 세션 ID는 적지 않습니다.
      value: |
        총괄: 프로젝트 총괄
        도메인 담당:
        실제 구현 주담당 한 명:
        독립 검토자:
        작업창 표시 이름:
        작업공간 / 브랜치 / 기준 SHA:
        기존 담당 재사용 또는 추가 배치 이유:
        생성·착수·인수 상태 / 인수 근거 링크:
    validations:
      required: true
  - type: textarea
    id: shared_contract
    attributes:
      label: 공유 인터페이스·작성자·통합 책임
      description: 공유 파일은 편집 금지 목록이 아닙니다. 총괄이 실제 작성자와 계약을 정하며 해당 없으면 없음으로 씁니다.
      value: |
        변경 예정 파일/영역:
        공유 접점 / 실제 작성자:
        공개 입력·출력 / 오류 / 상태 소유 / 호환성:
        통합 책임자 / 영향 검증:
        작업별 시험 데이터·프로세스 분리:
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 하위·선행 Issue와 병합 순서
      description: 독립 작업은 별도 Issue·공간·브랜치·PR로 병렬 배정합니다. 파일이 달라도 상태 의존성을 확인하고 없으면 없음으로 씁니다.
      value: |
        하위/선행 Issue·PR:
        병렬 실행 가능한 작업과 의존성:
        병합 순서 / 선행 병합 뒤 기준·영향 검증 갱신:
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: 현재 상태와 다음 행동
      value: "상태: 대기\n다음 행동: 총괄이 범위와 담당을 확정한 뒤 배정"
